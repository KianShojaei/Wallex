# Local / VPS run: auto-restart on crash, state/logs persisted on the host, dashboard on :8000.
services:
  agent:
    build: .
    env_file: .env
    environment:
      - RUN_MODE=${RUN_MODE:-shadow}
    command: ["serve"]
    ports: ["8000:8000"]
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
