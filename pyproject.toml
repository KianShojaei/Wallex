[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wallex-agent"
version = "0.1.0"
description = "Agentic AI trading engine for the Wallex exchange (StarCoach Agentic AI hackathon)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "openai>=1.40",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wallex-agent = "wallex_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wallex_agent.dashboard" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
